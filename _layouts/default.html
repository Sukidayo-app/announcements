<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ja' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Riamo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f9f9f9;
      color: #1a1a1a;
      line-height: 1.8;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #eee;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    header .logo {
      text-decoration: none;
      color: #1a1a1a;
      font-size: 18px;
      font-weight: 700;
    }
    header .logo span { color: #EE8514; }
    header nav { display: flex; gap: 16px; }
    header nav a {
      text-decoration: none;
      font-size: 14px;
      color: #666;
    }
    header nav a:hover { color: #EE8514; }
    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 24px;
    }
    footer {
      text-align: center;
      padding: 40px;
      color: #999;
      font-size: 13px;
    }
    .lang-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }
    .lang-tabs .tab {
      text-decoration: none;
      font-size: 13px;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid #ddd;
      color: #666;
    }
    .lang-tabs .tab:hover { border-color: #EE8514; color: #EE8514; }
    .lang-tabs .tab.active {
      background: #EE8514;
      border-color: #EE8514;
      color: #fff;
    }
    @media (max-width: 600px) {
      header { padding: 12px 16px; gap: 16px; }
      header .logo { font-size: 16px; }
      main { margin: 24px auto; padding: 0 16px; }
      footer { padding: 32px 16px; }
      .lang-tabs { flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
      .lang-tabs .tab { font-size: 12px; padding: 4px 10px; }
    }
  </style>
</head>
<body>
  <header>
    <a href="{{ site.baseurl }}/" class="logo"><span>Riamo</span></a>
    <nav>
      <a href="{{ site.baseurl }}/notice/">お知らせ</a>
      <a href="{{ site.baseurl }}/faq/">FAQ</a>
      <a href="{{ site.baseurl }}/terms/">利用規約</a>
      <a href="{{ site.baseurl }}/privacy/">プライバシーポリシー</a>
      <a href="{{ site.baseurl }}/tokushoho/">特定商取引法に基づく表記</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>© Sukidayo, Inc.</footer>
</body>
</html>
