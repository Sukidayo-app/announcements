---
layout: default
---
<style>
  .post-back { font-size: 14px; color: #999; text-decoration: none; display: inline-block; margin-bottom: 20px; }
  .post-back:hover { color: #EE8514; }
  .post-title { font-size: 26px; font-weight: 700; line-height: 1.4; margin-bottom: 10px; }
  .post-date { font-size: 14px; color: #999; }
  .post-divider { border: none; border-top: 1px solid #eee; margin: 24px 0; }
  .post-body { font-size: 16px; }
  .post-body h2 { font-size: 20px; font-weight: 700; margin: 32px 0 12px; }
  .post-body h3 { font-size: 17px; font-weight: 700; margin: 24px 0 8px; }
  .post-body p { margin-bottom: 16px; }
  .post-body ul, .post-body ol { padding-left: 24px; margin-bottom: 16px; }
  .post-body li { margin-bottom: 6px; }
  .post-body a { color: #EE8514; }
  .post-body blockquote {
    background: #f5f5f5;
    border-left: 4px solid #EE8514;
    padding: 16px 20px;
    border-radius: 4px;
    margin-bottom: 16px;
  }
</style>

<a href="{{ site.baseurl }}/notice/{{ page.lang }}/" class="post-back">← 一覧へ戻る</a>
<div class="post-title">{{ page.title }}</div>
<div class="post-date">{{ page.date | date: "%Y.%m.%d" }}</div>
<hr class="post-divider">
<div class="post-body">
  {{ content }}
</div>
